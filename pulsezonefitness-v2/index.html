<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseZone Fitness | Bhopal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
        color: #0a0a0a;
        background: #ffffff;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      input {
        font-family: inherit;
      }
      .pz-bebas {
        font-family: 'Bebas Neue', sans-serif;
      }
      .pz-watermark {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Bebas Neue', sans-serif;
        font-size: 15vw;
        line-height: 0.85;
        letter-spacing: 0.02em;
        color: #0a0a0a;
        opacity: 0.04;
        white-space: nowrap;
        pointer-events: none;
        user-select: none;
        z-index: 0;
      }
      .pz-img-cover {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .pz-hero-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-top: 1rem;
        max-width: 640px;
      }
      @media (max-width: 960px) {
        .pz-hero-cards {
          grid-template-columns: 1fr;
          max-width: 100%;
        }
      }
      .pz-nav-links {
        display: flex;
        align-items: center;
        gap: 2rem;
      }
      .pz-nav-toggle {
        display: none;
        background: none;
        border: none;
        padding: 0.25rem;
        color: #0a0a0a;
      }
      .pz-mobile-drawer {
        display: none;
      }
      @media (max-width: 960px) {
        header nav {
          grid-template-columns: 1fr auto !important;
        }
        .pz-nav-center {
          display: none !important;
        }
        .pz-join-desktop {
          display: none !important;
        }
        .pz-nav-toggle {
          display: flex;
        }
        .pz-mobile-drawer.pz-open {
          display: flex;
        }
      }
      .pz-hero-grid {
        display: flex;
        align-items: stretch;
        min-height: 88vh;
      }
      @media (max-width: 960px) {
        .pz-hero-grid {
          flex-direction: column;
          min-height: auto;
        }
      }
      .pz-community-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4rem;
        align-items: center;
      }
      @media (max-width: 960px) {
        .pz-community-grid {
          grid-template-columns: 1fr;
          gap: 2.5rem;
        }
      }
      .pz-class-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
      }
      @media (max-width: 720px) {
        .pz-class-grid {
          grid-template-columns: 1fr;
        }
      }
      .pz-blog-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
      }
      @media (max-width: 900px) {
        .pz-blog-row {
          grid-template-columns: 1fr;
        }
      }
      .pz-footer-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1.2fr;
        gap: 2.5rem;
      }
      @media (max-width: 900px) {
        .pz-footer-grid {
          grid-template-columns: 1fr;
        }
      }
      .pz-ig-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      .pz-trainer-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.75rem;
      }
      @media (max-width: 900px) {
        .pz-trainer-row {
          grid-template-columns: 1fr;
          max-width: 360px;
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
